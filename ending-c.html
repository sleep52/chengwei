<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>潮吞</title>
  <link rel="stylesheet" href="css/base.css">
  <style>
    body {
      background: #0a0c0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
    }

    .tide-swallow {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 0;
      background: linear-gradient(
        to top,
        rgba(13, 59, 79, 0.95),
        rgba(13, 59, 79, 0.7),
        rgba(13, 59, 79, 0.3),
        transparent
      );
      transition: height 10s ease;
      z-index: 1;
    }

    .tide-swallow.active { height: 100vh; }

    .ending-container {
      max-width: 500px;
      width: 100%;
      position: relative;
      z-index: 10;
      text-align: center;
    }

    .news-flash {
      background: #f5f0e8;
      border: 1px solid #c8b89a;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: left;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .news-flash.visible { opacity: 1; }

    .news-flash .headline {
      font-family: var(--font-official);
      font-size: 1rem;
      color: #8b0000;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid #c8b89a;
      padding-bottom: 0.5rem;
    }

    .news-flash p {
      font-size: 0.85rem;
      color: #2c1810;
      line-height: 1.8;
      text-indent: 2em;
      margin-bottom: 0.5rem;
    }

    .news-flash .highlight {
      color: #8b0000;
      font-weight: 600;
    }

    .server-status {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--color-danger);
      opacity: 0;
      transition: opacity 1s ease;
      margin-bottom: 2rem;
    }

    .server-status.visible { opacity: 1; }

    .letter {
      background: #f5f0e8;
      border: 1px solid #c8b89a;
      padding: 2rem;
      margin: 0 auto;
      max-width: 400px;
      font-family: var(--font-handwriting);
      font-size: 0.9rem;
      color: #2c1810;
      line-height: 2;
      text-align: left;
      opacity: 0;
      transition: opacity 3s ease;
      position: relative;
    }

    .letter.visible { opacity: 1; }

    .letter .sign {
      text-align: right;
      margin-top: 1rem;
      color: #5a3a1a;
    }

    .letter .salt-stain {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 40px;
      height: 40px;
      background: radial-gradient(circle, rgba(200,180,150,0.3), transparent);
      border-radius: 50%;
    }

    .ending-label {
      font-size: 0.75rem;
      color: var(--color-text-dim);
      margin-top: 2rem;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .ending-label.visible { opacity: 1; }

    .restart-link {
      display: none;
      margin-top: 1.5rem;
      font-size: 0.75rem;
    }

    .restart-link.visible { display: block; }
    .restart-link a { color: var(--color-text-dim); }
  </style>
</head>
<body data-page="ending-c">

  <div class="tide-swallow" id="tide-swallow"></div>

  <div class="ending-container">
    <div class="news-flash" id="news-flash">
      <div class="headline">闽南日报 · 突发</div>
      <p>今日凌晨，埕尾村附近海域发生异常<span class="highlight">大潮</span>，海水倒灌入村。截至发稿时，全村已<span class="highlight">被海水淹没</span>。</p>
      <p>救援人员表示，潮水退去后，村内建筑完好，但<span class="highlight">所有居民均已失踪</span>。目前原因不明。</p>
    </div>

    <div class="server-status" id="server-status">
      [ 连接中断 ]<br>
      潮生宫网站已离线<br>
      最后更新：----/--/--
    </div>

    <div class="letter" id="letter">
      <div class="salt-stain"></div>
      孩子：<br><br>
      你回来了。回来就好。<br>
      不管你外头做了什么，回来就好。<br>
      簿子我收着呢。上头的名字我一个没忘。<br>
      不要怕。<br>
      <div class="sign">—— 阿嬷</div>
    </div>

    <div class="ending-label" id="ending-label">
      结局C：仪式失败<br>
      你没来得及做选择。水把村子带走了。<br>
      后来谁也不记得那儿有过一个村子。就你还记得。
    </div>

    <div class="restart-link" id="restart-link">
      <a href="index.html">也许还有别的办法</a>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      Audio.init();
      Audio.playTide();

      setTimeout(() => {
        document.getElementById('news-flash').classList.add('visible');
      }, 2000);

      setTimeout(() => {
        document.getElementById('tide-swallow').classList.add('active');
      }, 4000);

      setTimeout(() => {
        document.getElementById('server-status').classList.add('visible');
      }, 8000);

      setTimeout(() => {
        document.getElementById('letter').classList.add('visible');
      }, 12000);

      setTimeout(() => {
        document.getElementById('ending-label').classList.add('visible');
      }, 18000);

      setTimeout(() => {
        document.getElementById('restart-link').classList.add('visible');
      }, 22000);
    });
  </script>
</body>
</html>
