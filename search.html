  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function render(query) {
    const q = (query || '').trim();
    const set = Object.values(PAGES).find(p => p.q === q);
    const input = document.getElementById('q');
    input.value = set ? set.q : q;
    document.title = (q || '云搜') + '_搜索结果';

    const list = document.getElementById('list');
    const stat = document.getElementById('stat');
    const tail = document.getElementById('tail');

    if (!set) {
      stat.textContent = q ? '相关结果约 0 条（用时 0.11 秒）' : '请输入关键词';
      list.innerHTML = `
        <div class="none">
          <h3>未找到与「${esc(q) || '—'}」相关的网页。</h3>
          <p>请尝试：</p>
          <ul>
            <li>检查输入是否有错别字</li>
            <li>换用更常见的关键词</li>
            <li>减少关键词数量</li>
          </ul>
          <p style="margin-top:14px;">部分网页无法被收录，无法显示其内容。</p>

        <div class="rel">
          <h4>大家都在搜</h4>
          <div class="chips">

            <a href="search.html?q=未开放岸段">未开放岸段</a>
          </div>
        </div>`;
      return;
    }

    stat.textContent = set.stat;
    list.innerHTML = set.list.map(r => `
      <div class="res">
        <div class="t${r.dead ? ' dead' : ''}">${r.href ? `<a href="${r.href}">${r.t}</a>` : `<a href="javascript:void(0)">${r.t}</a>`}</div>
        <div class="u">${r.u}</div>
        <div class="d">${r.d}</div>
        <div class="x">${(r.x || []).map(x => `<span>${x}</span>`).join('')}</div>
      </div>`).join('');

    tail.innerHTML = `
      ${set.rel ? `<div class="rel"><h4>相关搜索</h4><div class="chips">${set.rel.map(w => `<a href="search.html?q=${encodeURIComponent(w)}">${w}</a>`).join('')}</div></div>` : ''}

  document.querySelector('.sbox').addEventListener('submit', e => {
    e.preventDefault();
    render(document.getElementById('q').value);
    window.scrollTo(0, 0);
  });
</script>
